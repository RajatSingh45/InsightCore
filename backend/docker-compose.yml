services:
  backend:
    build: .
    container_name: backend
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    env_file:
      - .env
    command: npm start
    depends_on:
      - mongo
      - redis
  
  worker:
     build: .
     container_name: worker
     command: npm run worker
     volumes: 
       - .:/app
       - /app/node_modules
     env_file:
       - .env 
     depends_on:
       - mongo
       - redis

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  mongo-data: